name: Desktop cross-platform native gates
# Explicit dispatch on provisioned native hosts: no implicit untested OS skips.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: magpie-linux-x64
          - rid: win-x64
            runner: magpie-win-x64
          - rid: osx-arm64
            runner: magpie-osx-arm64
    runs-on: [self-hosted, '${{ matrix.runner }}']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test and verify AOT packaging without opening a window
        run: python scripts/verify-platform.py --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.rid }}
          path: |
            artifacts/platform-checks/${{ matrix.rid }}
            artifacts/native/${{ matrix.rid }}/Release/*.json
            artifacts/native/${{ matrix.rid }}/Release/*.log
            artifacts/desktop/${{ matrix.rid }}/Magpie.Desktop*
