name: Desktop native build and interaction models
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-port.yml'
      - '.gitattributes'
      - 'src/Magpie.Desktop/**'
      - 'src/Magpie.Native/**'
      - 'src/Effects/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keep ongoing numerical evidence when a follow-up revision repairs a native compiler error.
  group: desktop-native-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: win-x64
            runner: windows-2022
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Linux native toolchain and software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build cmake pkg-config libvulkan-dev mesa-vulkan-drivers libpipewire-0.3-dev pipewire python3-gi dbus-daemon libglib2.0-dev libfontconfig1-dev libglm-dev
          echo "VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)" >> "$GITHUB_ENV"
      - name: Prepare pinned Windows/macOS native dependencies
        if: runner.os != 'Linux'
        run: python scripts/prepare-desktop-ci.py
      - name: Build Windows native capture core before AOT
        id: windows_native
        if: runner.os == 'Windows'
        run: python scripts/build-native.py --rid win-x64 --configuration Release --build-dir artifacts/native/win-x64/Release
      - name: Disposable Windows source-window capture regression
        if: runner.os == 'Windows'
        run: python scripts/verify-windows-capture-fixture.py
      - name: Native SDK, AOT, interaction models and single executable
        id: platform_build
        # Keep the native fixture failure red, but collect the independent
        # production/UI evidence when its native build itself succeeded.
        if: ${{ !cancelled() && (success() || (runner.os == 'Windows' && steps.windows_native.outcome == 'success')) }}
        run: python scripts/verify-platform-build.py --rid ${{ matrix.rid }}
      - name: Disposable Windows production capture and UI lifecycle
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.platform_build.outcome == 'success' }}
        run: python scripts/verify-windows-production-lifecycle.py
      - name: Linux software Vulkan regression
        if: runner.os == 'Linux'
        run: python scripts/verify-platform.py --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.rid }}
          path: |
            artifacts/platform-build-checks/${{ matrix.rid }}
            artifacts/platform-checks/${{ matrix.rid }}
            artifacts/native/${{ matrix.rid }}/Release/*.json
            artifacts/native/${{ matrix.rid }}/Release/*.log
            artifacts/native/${{ matrix.rid }}/Release/Testing/Temporary/LastTest.log
            artifacts/native/${{ matrix.rid }}/Release/pipewire-capture
            artifacts/desktop/${{ matrix.rid }}/Magpie.Desktop*
