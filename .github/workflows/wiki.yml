name: Publish wiki
permissions:
  contents: write

# The retained WinUI/wiki workflows are opt-in in this port repository.
# Desktop builds and regressions are in desktop-port.yml.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Upload documentations to wiki
        run: python scripts/wiki.py ${{ secrets.CONTENTS_ACCESS_TOKEN }}
